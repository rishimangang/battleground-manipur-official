workflows:
  ios-build:
    name: Battleground Manipur iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show Unity version
        script: |
          echo "Unity version:"
          cat ProjectSettings/ProjectVersion.txt

      - name: Build Unity iOS project
        script: |
          mkdir -p build/ios

          /Applications/Unity/Hub/Editor/6000.5.0b11/Unity \
            -batchmode \
            -quit \
            -nographics \
            -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS \
            -executeMethod GameStarter.BuildIOS \
            -logFile -

    artifacts:
      - build/ios/**/*.ipa
      - build/ios/**/*.app

    publishing:
      email:
        recipients:
          - rishimangang20@gmail.com
        notify:
          success: true
          failure: true