workflows:
  ios-build:
    name: Battleground Manipur iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.battlegroundmanipur.game

    scripts:
      - name: Build Unity iOS
        script: |
          mkdir -p build/ios

          $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode \
            -quit \
            -nographics \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod GameStarter.BuildIOS \
            -logFile -

      - name: Apply signing
        script: |
          xcode-project use-profiles

      - name: Create IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/build/ios/Unity-iPhone.xcodeproj" \
            --scheme "Unity-iPhone"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.app

    publishing:
      email:
        recipients:
          - rishimangang20@gmail.com
        notify:
          success: true
          failure: true