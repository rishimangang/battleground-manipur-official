workflows:
  ios-build:
    name: Battleground Manipur iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.Battlegroundmanipur.game

    scripts:
      - name: Check Unity version
        script: |
          echo "Unity version:"
          cat ProjectSettings/ProjectVersion.txt

      - name: Build Unity iOS
        script: |
          mkdir -p build/ios

          /Applications/Unity/Hub/Editor/6000.5.0b11/Unity \
            -batchmode \
            -quit \
            -nographics \
            -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS \
            -executeMethod GameStarter.BuildIOS \
            -logFile -

      - name: Apply signing
        script: |
          xcode-project use-profiles

      - name: Create IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/build/ios/*.xcodeproj"

    artifacts:
      - build/ios/**/*.ipa
      - build/ios/**/*.app

    publishing:
      email:
        recipients:
          - rishimangang20@gmail.com
        notify:
          success: true
          failure: true